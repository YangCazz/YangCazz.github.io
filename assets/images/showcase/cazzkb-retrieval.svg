<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">CazzKB 检索增强生成概念流程</title><desc id="desc">文档经过解析分块，形成可检索内容；问题触发检索，相关证据与问题共同用于生成回答。这是概念图，不代表部署拓扑。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#58768b" stroke-width="1.5"/></marker></defs><rect width="900" height="540" fill="#edf3f6"/><g font-family="sans-serif" fill="#29465a"><text x="50" y="62" font-size="15" letter-spacing="3">CAZZKB / RETRIEVAL TO RESPONSE</text><g fill="#fff" stroke="#bdcdd9" stroke-width="2"><rect x="50" y="120" width="205" height="130" rx="8"/><rect x="348" y="120" width="205" height="130" rx="8"/><rect x="645" y="120" width="205" height="130" rx="8"/><rect x="348" y="350" width="205" height="125" rx="8"/><rect x="645" y="350" width="205" height="125" rx="8"/></g><g font-size="25" text-anchor="middle"><text x="153" y="179">文档</text><text x="450" y="179">解析与分块</text><text x="748" y="179">检索</text><text x="450" y="406">问题</text><text x="748" y="406">生成回答</text></g><g fill="#627c8f" font-size="16" text-anchor="middle"><text x="153" y="214">DOCUMENTS</text><text x="450" y="214">PARSE + CHUNK</text><text x="748" y="214">RETRIEVE</text><text x="450" y="442">QUESTION</text><text x="748" y="442">GENERATE</text></g><g stroke="#58768b" fill="none" stroke-width="2" marker-end="url(#arrow)"><path d="M255 185H337"/><path d="M553 185H634"/><path d="M748 250V339"/><path d="M553 413H634"/><path d="M450 350V300H685V261"/></g><g fill="#627c8f" font-size="16"><text x="766" y="305">证据</text><text x="514" y="287">查询</text><text x="50" y="513" font-size="13">概念流程 / 非部署拓扑 · 根据站内工程记录绘制</text></g></g></svg>