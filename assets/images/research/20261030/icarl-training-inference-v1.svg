<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">iCaRL：训练与推理是两条不同的路径</title><desc id="desc">训练使用新类数据、旧类样本及更新前模型的 sigmoid 输出；推理用当前特征计算样本均值，在全部已见类别中选最近原型。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#4f847c"/></marker></defs><rect width="1200" height="760" fill="#f8f7f3"/><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#243647}.title{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:600}.body{font-size:21px}.small{font-size:17px}.box{fill:#edf2ee;stroke:#4f847c;stroke-width:2}.line{fill:none;stroke:#4f847c;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="60" y="65" class="title">iCaRL：训练与推理是两条不同的路径</text><text x="60" y="116" class="label">01  增量训练</text><rect class="box" x="60" y="146" width="250" height="70" rx="8"/><text x="78" y="189.0" class="body">新类数据 + 旧类样本</text><path class="line" d="M325 181 L395 181"/><rect class="box" x="410" y="146" width="305" height="70" rx="8"/><text x="428" y="189.0" class="body">更新特征表示 + 分类输出</text><rect class="box" x="60" y="250" width="250" height="70" rx="8"/><text x="78" y="293.0" class="body">更新前的模型输出</text><path class="line" d="M325 285 L395 285"/><rect class="box" x="410" y="250" width="305" height="70" rx="8"/><text x="428" y="293.0" class="body">旧类 sigmoid 蒸馏目标</text><path class="line" d="M560 248 L560 220"/><text x="760" y="172" class="body">分类损失 + 蒸馏损失</text><text x="760" y="212" class="body">固定总样本预算 K</text><text x="760" y="252" class="body">增加新类后重分配样本</text><text x="760" y="292" class="small">样本保存为图像而非旧特征</text><path d="M60 368 H1140" stroke="#d5dedb" stroke-width="2"/><text x="60" y="416" class="label">02  全类别推理</text><rect class="box" x="60" y="450" width="260" height="70" rx="8"/><text x="78" y="493.0" class="body">当前编码器：查询图像</text><path class="line" d="M335 485 L405 485"/><rect class="box" x="420" y="450" width="290" height="70" rx="8"/><text x="438" y="493.0" class="body">查询特征</text><rect class="box" x="60" y="558" width="260" height="70" rx="8"/><text x="78" y="601.0" class="body">当前编码器：每类样本</text><path class="line" d="M335 593 L405 593"/><rect class="box" x="420" y="558" width="290" height="70" rx="8"/><text x="438" y="601.0" class="body">重新计算每类样本均值</text><path class="line" d="M725 485 L805 520"/><path class="line" d="M725 593 L805 558"/><rect class="box" x="820" y="500" width="300" height="85" rx="8"/><text x="838" y="550.5" class="body">选择最近的类别原型</text><text x="60" y="700" class="small">原创示意 · 根据 Rebuffi et al. (2017), §2 / Algorithms 1–5 整理</text><text x="60" y="730" class="small">样本与均值均使用归一化特征；原型会随编码器更新而变化，并非永久冻结。</text></svg>