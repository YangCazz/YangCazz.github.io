<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">持续学习：测试时到底知道什么？</title><desc id="desc">三行比较 Task-IL、Domain-IL 与 Class-IL 的任务身份、标签空间和测试要求。此图只比较评估协议，不是实验结果。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#4f847c"/></marker></defs><rect width="1200" height="760" fill="#f8f7f3"/><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#243647}.title{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:600}.body{font-size:21px}.small{font-size:17px}.box{fill:#edf2ee;stroke:#4f847c;stroke-width:2}.line{fill:none;stroke:#4f847c;stroke-width:2.5;marker-end:url(#arrow)}</style><text x="60" y="65" class="title">持续学习：测试时到底知道什么？</text><rect x="40" y="120" width="1120" height="160" rx="10" fill="#fff" stroke="#d5dedb"/><text x="64" y="158" class="label">01  TASK-IL</text><rect class="box" x="64" y="182" width="240" height="64" rx="8"/><text x="82" y="222.0" class="body">提供任务 ID</text><path class="line" d="M320 214 L370 214"/><rect class="box" x="386" y="182" width="330" height="64" rx="8"/><text x="404" y="222.0" class="body">选择对应任务的输出</text><text x="750" y="219" class="body">标签竞争限于当前任务</text><rect x="40" y="305" width="1120" height="160" rx="10" fill="#fff" stroke="#d5dedb"/><text x="64" y="343" class="label">02  DOMAIN-IL</text><rect class="box" x="64" y="367" width="240" height="64" rx="8"/><text x="82" y="407.0" class="body">不提供任务 ID</text><path class="line" d="M320 399 L370 399"/><rect class="box" x="386" y="367" width="330" height="64" rx="8"/><text x="404" y="407.0" class="body">共享输出语义</text><text x="750" y="404" class="body">输入域变化，标签含义保持</text><rect x="40" y="490" width="1120" height="160" rx="10" fill="#fff" stroke="#d5dedb"/><text x="64" y="528" class="label">03  CLASS-IL</text><rect class="box" x="64" y="552" width="240" height="64" rx="8"/><text x="82" y="592.0" class="body">不提供任务 ID</text><path class="line" d="M320 584 L370 584"/><rect class="box" x="386" y="552" width="330" height="64" rx="8"/><text x="404" y="592.0" class="body">所有已见类别共同判别</text><text x="750" y="589" class="body">标签空间随新类别扩展</text><text x="60" y="720" class="small">原创示意 · 根据 van de Ven &amp; Tolias (2019), §2 / Table 1 整理；不表示普遍性能排序</text></svg>