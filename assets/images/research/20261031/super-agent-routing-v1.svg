<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">Super-agent: one interface, isolated contexts</title><desc id="desc">Original interpretation of source sections 2–3. Two-stage filtering, cold-start Router dispatch, direct delivery to subscribed Workers, and unified outbound communication. Reference IDs enable on-demand recall.</desc><defs><marker id="a0B2045" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0B2045"/></marker><marker id="a1767B4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1767B4"/></marker><marker id="aF06A22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F06A22"/></marker><marker id="a087E83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087E83"/></marker><marker id="a8091AA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8091AA"/></marker></defs><rect width="1536" height="1024" fill="white"/><g font-family="Liberation Serif, Times New Roman, serif" fill="#0B2045"><text x="768" y="58" font-size="42" font-weight="bold" text-anchor="middle" fill="#0B2045">Super-agent: one interface, isolated contexts</text><polyline points="24,88 1512,88" fill="none" stroke="#8091AA" stroke-width="2.5" stroke-linejoin="round"/><circle cx="46" cy="124" r="21" fill="#0B2045"/><text x="46" y="132" font-size="27" font-weight="bold" text-anchor="middle" fill="white">1</text><text x="81" y="134" font-size="32" font-weight="bold" text-anchor="start" fill="#0B2045">Event admission and task routing</text><rect x="35" y="235" width="230" height="152" rx="8" fill="#FFF2E8" stroke="#F06A22" stroke-width="2.3"/><text x="150.0" y="267" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Incoming events</text><text x="150.0" y="300" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">IM · review · CI</text><text x="150.0" y="328" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Trigger + Thread ID</text><rect x="330" y="182" width="280" height="110" rx="8" fill="#FFFFFF" stroke="#0B2045" stroke-width="2.3"/><text x="470.0" y="214" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Program policy</text><text x="470.0" y="247" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Source / scope / allowlist</text><rect x="330" y="342" width="280" height="110" rx="8" fill="#FFFFFF" stroke="#0B2045" stroke-width="2.3"/><text x="470.0" y="374" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Semantic policy</text><text x="470.0" y="407" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Act, defer, or stay silent</text><polyline points="265,282 295,282 295,237 330,237" fill="none" stroke="#F06A22" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#aF06A22)"/><polyline points="470,292 470,342" fill="none" stroke="#0B2045" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a0B2045)"/><text x="486" y="323" font-size="20" font-weight="normal" text-anchor="start" fill="#0B2045">candidate</text><rect x="735" y="180" width="295" height="150" rx="8" fill="#EDF8F7" stroke="#087E83" stroke-width="2.3"/><text x="882.5" y="212" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Router layer</text><text x="882.5" y="245" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Cross-task context</text><text x="882.5" y="273" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">New-task dispatch</text><polyline points="610,397 658,397 658,255 735,255" fill="none" stroke="#0B2045" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a0B2045)"/><text x="666" y="208" font-size="21" font-weight="normal" text-anchor="start" fill="#0B2045">new</text><text x="666" y="231" font-size="21" font-weight="normal" text-anchor="start" fill="#0B2045">task</text><rect x="1160" y="240" width="335" height="130" rx="8" fill="#EDF8F7" stroke="#087E83" stroke-width="2.3"/><text x="1327.5" y="272" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Worker A</text><text x="1327.5" y="305" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Task context + tools</text><text x="1327.5" y="333" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Subscribes to Thread X</text><rect x="1160" y="430" width="335" height="130" rx="8" fill="#EDF8F7" stroke="#087E83" stroke-width="2.3"/><text x="1327.5" y="462" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Worker B</text><text x="1327.5" y="495" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Task context + tools</text><text x="1327.5" y="523" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Subscribes to X and Y</text><polyline points="1030,225 1090,225 1090,275 1160,275" fill="none" stroke="#0B2045" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a0B2045)"/><text x="1048" y="199" font-size="21" font-weight="normal" text-anchor="start" fill="#0B2045">assign</text><polyline points="610,424 695,424 695,490 1110,490 1110,335 1160,335" fill="none" stroke="#F06A22" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#aF06A22)"/><polyline points="1110,490 1160,490" fill="none" stroke="#F06A22" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#aF06A22)"/><text x="740" y="477" font-size="25" font-weight="bold" text-anchor="start" fill="#F06A22">Subscribed event: direct delivery</text><text x="740" y="519" font-size="22" font-weight="normal" text-anchor="start" fill="#0B2045">Many-to-many Thread subscriptions</text><polyline points="695,424 695,350 835,350 835,330" fill="none" stroke="#8091AA" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#a8091AA)"/><text x="740" y="384" font-size="22" font-weight="normal" text-anchor="start" fill="#8091AA">Router retains global observation</text><text x="41" y="481" font-size="23" font-weight="bold" text-anchor="start" fill="#0B2045">Filtered out?</text><text x="41" y="511" font-size="21" font-weight="normal" text-anchor="start" fill="#0B2045">No model call on code rejection;</text><text x="41" y="539" font-size="21" font-weight="normal" text-anchor="start" fill="#0B2045">no action on semantic rejection.</text><polyline points="24,585 1512,585" fill="none" stroke="#8091AA" stroke-width="2.5" stroke-linejoin="round"/><circle cx="46" cy="621" r="21" fill="#0B2045"/><text x="46" y="629" font-size="27" font-weight="bold" text-anchor="middle" fill="white">2</text><text x="81" y="631" font-size="32" font-weight="bold" text-anchor="start" fill="#0B2045">Outbound communication remains unified</text><rect x="65" y="665" width="310" height="94" rx="8" fill="#EDF8F7" stroke="#087E83" stroke-width="2.3"/><text x="220.0" y="697" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Worker reports</text><text x="220.0" y="730" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Key results, not raw traces</text><rect x="605" y="665" width="300" height="94" rx="8" fill="#EDF8F7" stroke="#087E83" stroke-width="2.3"/><text x="755.0" y="697" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Same Router layer</text><text x="755.0" y="730" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Global memory + response</text><rect x="1130" y="665" width="330" height="94" rx="8" fill="#FFF2E8" stroke="#F06A22" stroke-width="2.3"/><text x="1295.0" y="697" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Human-facing channels</text><text x="1295.0" y="730" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">IM · GitHub · email</text><polyline points="375,712 605,712" fill="none" stroke="#0B2045" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a0B2045)"/><polyline points="905,712 1130,712" fill="none" stroke="#0B2045" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a0B2045)"/><text x="429" y="696" font-size="22" font-weight="normal" text-anchor="start" fill="#0B2045">report</text><text x="962" y="696" font-size="22" font-weight="normal" text-anchor="start" fill="#0B2045">reply</text><polyline points="24,790 1512,790" fill="none" stroke="#8091AA" stroke-width="2.5" stroke-linejoin="round"/><circle cx="46" cy="826" r="21" fill="#0B2045"/><text x="46" y="834" font-size="27" font-weight="bold" text-anchor="middle" fill="white">3</text><text x="81" y="836" font-size="32" font-weight="bold" text-anchor="start" fill="#0B2045">Chain of Recall: follow references, not full-history injection</text><rect x="50" y="870" width="250" height="96" rx="8" fill="#EDF4FC" stroke="#1767B4" stroke-width="2.3"/><text x="175.0" y="902" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Trigger</text><text x="175.0" y="935" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Thread ID + excerpt</text><rect x="400" y="870" width="260" height="96" rx="8" fill="#EDF4FC" stroke="#1767B4" stroke-width="2.3"/><text x="530.0" y="902" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Thread</text><text x="530.0" y="935" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Worker ID + summary</text><rect x="760" y="870" width="280" height="96" rx="8" fill="#EDF4FC" stroke="#1767B4" stroke-width="2.3"/><text x="900.0" y="902" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Worker Session</text><text x="900.0" y="935" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Related Thread IDs</text><rect x="1140" y="870" width="340" height="96" rx="8" fill="#EDF4FC" stroke="#1767B4" stroke-width="2.3"/><text x="1310.0" y="902" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Other Thread</text><text x="1310.0" y="935" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Review context on demand</text><polyline points="300,919 400,919" fill="none" stroke="#1767B4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a1767B4)"/><polyline points="660,919 760,919" fill="none" stroke="#1767B4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a1767B4)"/><polyline points="1040,919 1140,919" fill="none" stroke="#1767B4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a1767B4)"/><text x="768" y="1002" font-size="20" font-weight="normal" text-anchor="middle" fill="#8091AA">Schematic of the design proposal · no measured throughput · some control paths omitted</text></g></svg>