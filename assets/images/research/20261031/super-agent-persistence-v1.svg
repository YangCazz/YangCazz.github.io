<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">Persistent agents: separate compute, state, and environment</title><desc id="desc">Original interpretation of source sections 5–6. Stateless cloud Agent Loop accesses external persistent Session state and invokes execution-only endpoint daemons. An independent Watchdog observes health and progress. This is a design proposal, not a claim of deployed cloud infrastructure.</desc><defs><marker id="a0B2045" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#0B2045"/></marker><marker id="a1767B4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1767B4"/></marker><marker id="aF06A22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F06A22"/></marker><marker id="a087E83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087E83"/></marker><marker id="a8091AA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8091AA"/></marker></defs><rect width="1536" height="1024" fill="white"/><g font-family="Liberation Serif, Times New Roman, serif" fill="#0B2045"><text x="768" y="58" font-size="42" font-weight="bold" text-anchor="middle" fill="#0B2045">Persistent agents: separate compute, state, and environment</text><polyline points="24,90 1512,90" fill="none" stroke="#8091AA" stroke-width="2.5" stroke-linejoin="round"/><circle cx="46" cy="126" r="21" fill="#0B2045"/><text x="46" y="134" font-size="27" font-weight="bold" text-anchor="middle" fill="white">1</text><text x="81" y="136" font-size="32" font-weight="bold" text-anchor="start" fill="#0B2045">Cloud-side compute and durable state</text><rect x="65" y="198" width="570" height="220" rx="8" fill="#EDF8F7" stroke="#087E83" stroke-width="2.3"/><text x="350.0" y="230" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Agent Loop · replaceable compute</text><text x="350.0" y="263" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Router / Worker sessions are logical roles</text><text x="350.0" y="291" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Inference + scheduling + tool requests</text><rect x="115" y="330" width="130" height="62" rx="8" fill="#FFFFFF" stroke="#087E83" stroke-width="2.3"/><text x="180.0" y="362" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Loop</text><rect x="275" y="330" width="130" height="62" rx="8" fill="#FFFFFF" stroke="#087E83" stroke-width="2.3"/><text x="340.0" y="362" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Loop</text><rect x="435" y="330" width="130" height="62" rx="8" fill="#FFFFFF" stroke="#087E83" stroke-width="2.3"/><text x="500.0" y="362" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Loop</text><rect x="800" y="198" width="355" height="220" rx="8" fill="#EDF4FC" stroke="#1767B4" stroke-width="2.3"/><text x="977.5" y="230" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Persistent state</text><text x="977.5" y="263" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Session logs</text><text x="977.5" y="291" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Task / Thread references</text><text x="977.5" y="319" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Stored outside compute</text><polyline points="635,255 800,255" fill="none" stroke="#1767B4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a1767B4)"/><text x="687" y="239" font-size="22" font-weight="normal" text-anchor="start" fill="#0B2045">write</text><polyline points="800,348 635,348" fill="none" stroke="#1767B4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a1767B4)"/><text x="688" y="379" font-size="22" font-weight="normal" text-anchor="start" fill="#0B2045">restore</text><text x="100" y="460" font-size="25" font-weight="bold" text-anchor="start" fill="#0B2045">Restarting compute need not erase task history.</text><text x="100" y="495" font-size="23" font-weight="normal" text-anchor="start" fill="#0B2045">Recovery still depends on durable writes and valid state.</text><polyline points="1190,175 1190,901" fill="none" stroke="#8091AA" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6"/><rect x="1240" y="216" width="255" height="222" rx="8" fill="#FFFFFF" stroke="#0B2045" stroke-width="2.3"/><text x="1367.5" y="248" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Watchdog</text><text x="1367.5" y="281" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Independent Session</text><text x="1367.5" y="309" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Timer-driven checks</text><text x="1367.5" y="337" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Health + task progress</text><text x="1367.5" y="365" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Intervene on faults</text><polyline points="1240,245 1210,245 1210,170 350,170 350,198" fill="none" stroke="#8091AA" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#a8091AA)"/><text x="790" y="161" font-size="20" font-weight="normal" text-anchor="start" fill="#8091AA">inspect / intervene</text><text x="1225" y="490" font-size="24" font-weight="bold" text-anchor="start" fill="#0B2045">External control loop</text><text x="1225" y="529" font-size="21" font-weight="normal" text-anchor="start" fill="#0B2045">Not just process liveness.</text><text x="1225" y="562" font-size="21" font-weight="normal" text-anchor="start" fill="#0B2045">A separate observer;</text><text x="1225" y="590" font-size="21" font-weight="normal" text-anchor="start" fill="#0B2045">not a safety guarantee.</text><polyline points="24,540 1512,540" fill="none" stroke="#8091AA" stroke-width="2.5" stroke-linejoin="round"/><circle cx="46" cy="576" r="21" fill="#0B2045"/><text x="46" y="584" font-size="27" font-weight="bold" text-anchor="middle" fill="white">2</text><text x="81" y="586" font-size="32" font-weight="bold" text-anchor="start" fill="#0B2045">Real execution environments remain in place</text><text x="100" y="635" font-size="23" font-weight="bold" text-anchor="start" fill="#F06A22">Tool request</text><text x="100" y="673" font-size="22" font-weight="normal" text-anchor="start" fill="#0B2045">via a shared interface</text><polyline points="72,418 72,690 570,690 570,710" fill="none" stroke="#F06A22" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#aF06A22)"/><text x="600" y="627" font-size="23" font-weight="bold" text-anchor="start" fill="#1767B4">Result / environment context</text><text x="600" y="651" font-size="20" font-weight="normal" text-anchor="start" fill="#8091AA">One return path shown; others omitted</text><polyline points="1045,710 1045,657 1172,657 1172,440 635,440 635,399" fill="none" stroke="#1767B4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a1767B4)"/><rect x="50" y="710" width="310" height="213" rx="8" fill="#FFFFFF" stroke="#0B2045" stroke-width="2.3"/><text x="205.0" y="742" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Personal machine</text><text x="205.0" y="775" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Working tree + local tools</text><text x="205.0" y="803" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">May be intermittently online</text><rect x="85" y="842" width="240" height="58" rx="8" fill="#EDF8F7" stroke="#087E83" stroke-width="2.3"/><text x="205.0" y="874" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Execution daemon</text><rect x="440" y="710" width="310" height="213" rx="8" fill="#FFFFFF" stroke="#0B2045" stroke-width="2.3"/><text x="595.0" y="742" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Managed machine</text><text x="595.0" y="775" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Repository + toolchain</text><text x="595.0" y="803" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Cloud-hosted environment</text><rect x="475" y="842" width="240" height="58" rx="8" fill="#EDF8F7" stroke="#087E83" stroke-width="2.3"/><text x="595.0" y="874" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Execution daemon</text><rect x="830" y="710" width="310" height="213" rx="8" fill="#FFFFFF" stroke="#0B2045" stroke-width="2.3"/><text x="985.0" y="742" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Private environment</text><text x="985.0" y="775" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Internal services + devices</text><text x="985.0" y="803" font-size="23" font-weight="normal" text-anchor="middle" fill="#0B2045">Access depends on connectivity</text><rect x="865" y="842" width="240" height="58" rx="8" fill="#EDF8F7" stroke="#087E83" stroke-width="2.3"/><text x="985.0" y="874" font-size="27" font-weight="bold" text-anchor="middle" fill="#0B2045">Execution daemon</text><polyline points="570,690 205,690 205,710" fill="none" stroke="#F06A22" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#aF06A22)"/><polyline points="570,690 985,690 985,710" fill="none" stroke="#F06A22" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#aF06A22)"/><text x="60" y="968" font-size="25" font-weight="bold" text-anchor="start" fill="#0B2045">Daemon executes commands and returns results; it does not own Session state.</text><text x="60" y="1002" font-size="21" font-weight="normal" text-anchor="start" fill="#8091AA">Design proposal, not a deployment inventory · trust boundaries and credential protection require additional controls</text></g></svg>